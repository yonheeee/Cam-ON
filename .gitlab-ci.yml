# GitLab CI/CD — develop-backend 브랜치에 push/머지되면 EC2에 자동 배포한다.
#
# 전제(deploy/CICD.md 참고):
#   - EC2에 gitlab-runner(shell executor)가 ubuntu 사용자로 설치·등록되어 있고,
#     그 러너에 "deploy" 태그가 붙어 있어야 한다.
#   - ubuntu 사용자는 docker 그룹 소속이고, ~/camon 에 레포가 clone되어 있으며,
#     git 자격증명(~/.git-credentials)과 deploy/.env(시크릿)가 준비돼 있어야 한다.
#
# 이 잡은 CI가 만든 임시 clone 대신 서버의 배포 디렉토리(~/camon)에서 직접 pull+기동한다 —
# deploy/.env(깃에 안 올리는 시크릿)를 서버에 있는 그대로 재사용하기 위함이다.

stages:
  - deploy

deploy:
  stage: deploy
  tags:
    - deploy   # EC2에 등록한 러너 태그와 반드시 일치해야 함
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop-backend"'
  script:
    - cd ~/camon
    - git fetch origin
    - git checkout develop-backend
    - git reset --hard origin/develop-backend   # 서버 배포 디렉토리를 원격과 정확히 일치시킴(.env는 gitignore라 유지됨)
    - cd deploy
    - docker compose -f docker-compose.prod.yml up -d --build
