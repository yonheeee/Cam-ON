<!doctype html>
<!-- lang은 ko다. 한국어 페이지를 en으로 선언해 두면 크롬이 매번 번역 배너를 띄우고,
     스크린 리더가 영어 음성으로 읽는다. Vite 템플릿 기본값이 en이라 그대로 남아 있었다. -->
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 파비콘은 assets/cam-on-v3-o-symbol-transparent.png(324×388)에서 만든다. 원본이 정사각이
         아니라 그대로 걸면 브라우저가 정사각 칸에 맞추며 가로로 눌리므로, 좌우에 투명 여백을
         넣어 388×388로 맞춘 favicon.png를 쓴다. 탭에 실제로 그려지는 크기용으로 32×32를 따로
         두는 건 픽셀 아트라서다 — 큰 이미지를 브라우저가 알아서 줄이면 격자가 뭉개진다. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="388x388" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <link
      rel="preload"
      as="audio"
      href="/assets/sounds/party-lobby-pixel.mp3"
      type="audio/mpeg"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cam, On!</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
