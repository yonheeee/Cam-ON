<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>Cam-ON — 물건 가져오기 실시간 테스트</title>
<style>
  /* AI 서버 전용 개발 도구 — 실서비스 UI 아님 (그건 frontend에서 테마 입혀서 구현) */
  body { font-family: system-ui, 'Malgun Gothic', sans-serif; background: #1b1230; color: #fffdf5;
         margin: 0; padding: 24px; display: flex; gap: 24px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .stage { position: relative; width: 640px; max-width: 100%; }
  video { width: 100%; border-radius: 8px; transform: scaleX(-1); /* 거울 모드 */ }
  #roi { position: absolute; border: 3px dashed #ffd966; border-radius: 8px; pointer-events: none;
         box-shadow: 0 0 0 9999px rgb(0 0 0 / 0.35); }
  #roi.valid { border-color: #b8ff4f; border-style: solid; }
  .panel { min-width: 300px; flex: 1; }
  label { display: block; margin: 10px 0 4px; font-size: 13px; opacity: 0.8; }
  select, input[type=range], button { font-size: 15px; padding: 6px 10px; }
  button { cursor: pointer; border-radius: 6px; border: none; padding: 10px 18px; font-weight: 700; }
  #toggle { background: #ffd966; }
  #result { margin-top: 16px; padding: 14px; background: rgb(255 255 255 / 0.07); border-radius: 8px; }
  #detected { font-size: 26px; font-weight: 800; }
  #detected.hit { color: #b8ff4f; }
  .bar { height: 10px; background: rgb(255 255 255 / 0.15); border-radius: 5px; margin: 6px 0 12px; }
  .bar > div { height: 100%; border-radius: 5px; background: #2fc7be; width: 0%; transition: width 120ms; }
  #scores { font-size: 13px; line-height: 1.7; opacity: 0.85; white-space: pre; }
  #meta { font-size: 12px; opacity: 0.6; margin-top: 8px; }
  #banner { position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
            background: rgb(0 0 0 / 0.6); font-size: 56px; font-weight: 900; color: #b8ff4f; }
</style>
</head>
<body>
  <div class="stage">
    <h1>물건 가져오기 — 실시간 판정 테스트</h1>
    <video id="video" autoplay playsinline muted></video>
    <div id="roi"></div>
  </div>

  <div class="panel">
    <label>제시어 (이 물건을 ROI 안에!)</label>
    <select id="target"></select>

    <label>전송 주기: <span id="intervalLabel">200</span>ms</label>
    <input type="range" id="interval" min="100" max="2000" step="100" value="200" />

    <label>ROI 크기: <span id="roiLabel">80</span>%</label>
    <input type="range" id="roiSize" min="30" max="90" step="5" value="80" />

    <p><button id="toggle">시작</button></p>

    <div id="result">
      <div>인식: <span id="detected">—</span></div>
      <div class="bar"><div id="confBar"></div></div>
      <div id="scores"></div>
      <div id="meta"></div>
    </div>
  </div>

  <div id="banner">성공! 🎉</div>

<script>
// 게임 규칙 근사: 제시어와 일치하는 유효 판정이 연속 N회면 "성공" — 프론트 본구현 시 동일 로직 사용 예정
const REQUIRED_STREAK = 2;
const GAME_ID = 2; // 물건 가져오기 (임시)

const video = document.getElementById('video');
const roiBox = document.getElementById('roi');
const targetSelect = document.getElementById('target');
const toggleBtn = document.getElementById('toggle');

let running = false, timer = null, inflight = false, streak = 0;

async function init() {
  // 라벨 풀은 서버(labels.py)가 원본 — 하드코딩 중복 방지
  const labels = await fetch('/dev/labels').then(r => r.json());
  for (const ko of labels) {
    const option = document.createElement('option');
    option.value = ko; option.textContent = ko;
    targetSelect.appendChild(option);
  }
  const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
  video.srcObject = stream;
  layoutRoi();
}

function layoutRoi() {
  const percent = Number(document.getElementById('roiSize').value);
  document.getElementById('roiLabel').textContent = percent;
  const rect = video.getBoundingClientRect();
  const size = Math.min(rect.width, rect.height) * percent / 100;
  roiBox.style.width = size + 'px';
  roiBox.style.height = size + 'px';
  roiBox.style.left = (video.offsetLeft + rect.width / 2 - size / 2) + 'px';
  roiBox.style.top = (video.offsetTop + rect.height / 2 - size / 2) + 'px';
}

function cropRoi() {
  // 화면 중앙 정사각 ROI를 원본 프레임 좌표로 환산해 crop (거울 모드는 중앙 대칭이라 영향 없음)
  const percent = Number(document.getElementById('roiSize').value);
  const side = Math.min(video.videoWidth, video.videoHeight) * percent / 100;
  const sx = (video.videoWidth - side) / 2, sy = (video.videoHeight - side) / 2;
  const canvas = document.createElement('canvas');
  canvas.width = canvas.height = 384; // so400m 입력 해상도에 맞춤
  canvas.getContext('2d').drawImage(video, sx, sy, side, side, 0, 0, 384, 384);
  return new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.85));
}

async function tick() {
  if (inflight || !video.videoWidth) return;
  inflight = true;
  const started = performance.now();
  try {
    const blob = await cropRoi();
    const form = new FormData();
    form.append('image', blob, 'roi.jpg');
    form.append('target', targetSelect.value);
    const res = await fetch(`/ai/games/${GAME_ID}/fetch-object/detections`, { method: 'POST', body: form });
    const { data } = await res.json();
    render(data, performance.now() - started);
  } catch (err) {
    document.getElementById('meta').textContent = '요청 실패: ' + err;
  } finally {
    inflight = false;
  }
}

function render(data, elapsedMs) {
  const detectedEl = document.getElementById('detected');
  // 판정은 제시어 기준(isTargetMatch) — argmax가 비슷한 라벨에 1등을 뺏겨도
  // 제시어 점수가 임계값 이상 + 상위권이면 성공으로 본다
  const hit = data.isTargetMatch === true;
  detectedEl.textContent = data.detectedValue ?? '(없음)';
  detectedEl.className = hit ? 'hit' : '';
  document.getElementById('confBar').style.width = ((data.targetScore ?? 0) * 100) + '%';
  document.getElementById('scores').textContent =
    Object.entries(data.scores).map(([label, score]) => `${label.padEnd(8, ' ')} ${score}`).join('\n');
  document.getElementById('meta').textContent =
    `왕복 ${elapsedMs.toFixed(0)}ms · 제시어 점수 ${data.targetScore ?? '-'} (${data.targetRank ?? '-'}위)` +
    ` · 연속 일치 ${streak}/${REQUIRED_STREAK}`;
  roiBox.classList.toggle('valid', hit);

  streak = hit ? streak + 1 : 0;
  if (streak >= REQUIRED_STREAK) {
    streak = 0;
    stop();
    const banner = document.getElementById('banner');
    banner.style.display = 'flex';
    setTimeout(() => banner.style.display = 'none', 1500);
  }
}

function start() {
  running = true; streak = 0;
  toggleBtn.textContent = '중지';
  timer = setInterval(tick, Number(document.getElementById('interval').value));
}
function stop() {
  running = false;
  toggleBtn.textContent = '시작';
  clearInterval(timer);
}

toggleBtn.onclick = () => running ? stop() : start();
document.getElementById('interval').oninput = (e) => {
  document.getElementById('intervalLabel').textContent = e.target.value;
  if (running) { clearInterval(timer); timer = setInterval(tick, Number(e.target.value)); }
};
document.getElementById('roiSize').oninput = layoutRoi;
window.onresize = layoutRoi;
video.onloadedmetadata = layoutRoi;

init().catch(err => alert('초기화 실패 (카메라 권한?): ' + err));
</script>
</body>
</html>
